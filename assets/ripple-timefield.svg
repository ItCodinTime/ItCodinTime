      <ellipse cx="520" cy="448" rx="348" ry="86" fill="url(#softGray)" transform="rotate(-7 520 448)"/>
      <ellipse cx="210" cy="343" rx="335" ry="82" fill="url(#heavyDust)" opacity="0.16" transform="rotate(-5 210 343)"/>
