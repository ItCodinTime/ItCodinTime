<svg width="1400" height="520" viewBox="0 0 1400 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Monochrome ripple timefield for Goutham Ronanki</title>
  <desc id="desc">A black and white futuristic field with sand-like particles, circular ripples, time marks, and structured achievement labels.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="47%" r="58%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="44%" stop-color="#d6c39a" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sand" x1="170" y1="76" x2="1197" y2="449" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf4"/>
      <stop offset="0.47" stop-color="#d8c49a"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="microgrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

