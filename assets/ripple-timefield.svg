<svg width="1400" height="520" viewBox="0 0 1400 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Granular monochrome ripple field for Goutham Ronanki</title>
  <desc id="desc">A futuristic black and white sand-like ripple field with soft abstract shadows, a diagonal white flow, and minimal achievement labels.</desc>
  <defs>
    <radialGradient id="softBlack" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#050609" stop-opacity="0.96"/>
      <stop offset="39%" stop-color="#090a0d" stop-opacity="0.7"/>
      <stop offset="73%" stop-color="#0d0f12" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0d0f12" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="softGray" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121418" stop-opacity="0.5"/>
      <stop offset="56%" stop-color="#15171a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#15171a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="paper" x1="55" y1="-25" x2="1290" y2="539" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#f2f0ea"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="ribbonShadow" x1="365" y1="-58" x2="939" y2="578" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0d10" stop-opacity="0.02"/>
      <stop offset="0.3" stop-color="#0b0d10" stop-opacity="0.34"/>
      <stop offset="0.56" stop-color="#0b0d10" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0b0d10" stop-opacity="0"/>
    </linearGradient>

    <pattern id="fineDust" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="2.1" r="0.55" fill="#050609" opacity="0.42"/>
      <circle cx="6.2" cy="1.3" r="0.35" fill="#050609" opacity="0.32"/>
      <circle cx="3.3" cy="7.1" r="0.48" fill="#050609" opacity="0.36"/>
      <circle cx="8.4" cy="6.3" r="0.31" fill="#050609" opacity="0.28"/>
      <circle cx="5.4" cy="4.8" r="0.22" fill="#050609" opacity="0.24"/>
    </pattern>

    <pattern id="heavyDust" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.1" cy="1.2" r="0.55" fill="#050609" opacity="0.58"/>
      <circle cx="5.6" cy="2.1" r="0.46" fill="#050609" opacity="0.48"/>
      <circle cx="2.7" cy="5.8" r="0.52" fill="#050609" opacity="0.54"/>
      <circle cx="6.5" cy="6.1" r="0.23" fill="#050609" opacity="0.4"/>
    </pattern>

    <clipPath id="frame">
      <rect width="1400" height="520"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1400" height="520" fill="url(#paper)"/>
    <rect width="1400" height="520" fill="url(#fineDust)" opacity="0.19"/>

    <g opacity="0.95">
      <ellipse cx="1036" cy="141" rx="560" ry="181" fill="url(#softBlack)" transform="rotate(11 1036 141)"/>
      <ellipse cx="1244" cy="310" rx="388" ry="130" fill="url(#softGray)" transform="rotate(13 1244 310)"/>
      <ellipse cx="1068" cy="142" rx="510" ry="150" fill="url(#heavyDust)" opacity="0.14" transform="rotate(11 1068 142)"/>
    </g>

    <g opacity="0.92">
