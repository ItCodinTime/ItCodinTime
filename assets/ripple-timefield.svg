      <path d="M292 -62C341 60 404 153 492 242C551 303 623 367 720 456" stroke="url(#fineDust)" stroke-width="130" stroke-linecap="round" opacity="0.22"/>
    </g>

    <path d="M382 -82C441 76 527 167 631 267C739 371 856 458 1017 594" stroke="#ffffff" stroke-width="132" stroke-linecap="round" opacity="0.98"/>
    <path d="M408 -60C466 88 547 172 648 266C749 360 870 448 1006 569" stroke="#f7f6f1" stroke-width="68" stroke-linecap="round" opacity="0.82"/>

    <g opacity="0.16" stroke="#050609" stroke-width="1">
      <path d="M-55 455C143 360 290 345 468 392C652 440 798 443 972 358C1144 274 1269 256 1452 329"/>
      <path d="M-24 416C168 324 314 306 491 351C670 397 811 399 974 321C1144 238 1267 218 1434 275"/>
      <path d="M6 377C184 287 346 267 518 310C685 352 831 357 988 282C1134 213 1260 192 1406 222"/>
      <path d="M40 338C210 250 376 231 546 271C703 309 845 314 1003 243C1138 182 1256 160 1369 168"/>
      <path d="M78 299C238 216 410 192 574 231C726 267 865 276 1021 209C1144 156 1248 132 1322 125"/>
    </g>

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <text x="70" y="86" fill="#090a0d" font-size="12" letter-spacing="5" opacity="0.64">AI SYSTEMS / RESEARCH / FOUNDER / DEBATE</text>
      <text x="70" y="159" fill="#050505" font-size="72" font-weight="720" letter-spacing="0">Goutham Ronanki</text>
      <text x="74" y="204" fill="#111215" font-size="21" opacity="0.72">Useful machines. Faster research. Sharper execution.</text>
    </g>

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" letter-spacing="1.5">
      <g transform="translate(74 350)">
        <rect width="180" height="46" fill="#ffffff" fill-opacity="0.66" stroke="#050505" stroke-opacity="0.14"/>
        <text x="18" y="20" fill="#050505" opacity="0.52">01</text>
        <text x="55" y="20" fill="#050505" font-weight="650">Published</text>
        <text x="55" y="35" fill="#050505" opacity="0.56">researcher</text>
      </g>
      <g transform="translate(273 350)">
        <rect width="180" height="46" fill="#ffffff" fill-opacity="0.66" stroke="#050505" stroke-opacity="0.14"/>
        <text x="18" y="20" fill="#050505" opacity="0.52">02</text>
        <text x="55" y="20" fill="#050505" font-weight="650">Founder</text>
        <text x="55" y="35" fill="#050505" opacity="0.56">SH1P / koov</text>
      </g>
      <g transform="translate(472 350)">
        <rect width="180" height="46" fill="#ffffff" fill-opacity="0.66" stroke="#050505" stroke-opacity="0.14"/>
        <text x="18" y="20" fill="#050505" opacity="0.52">03</text>
        <text x="55" y="20" fill="#050505" font-weight="650">FTC</text>
        <text x="55" y="35" fill="#050505" opacity="0.56">30801 / 11419</text>
      </g>
    </g>

    <g transform="translate(1040 350)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" opacity="0.82">
      <text x="0" y="0" fill="#050505" font-size="12" letter-spacing="4">SAND / TIME / SIGNAL</text>
      <line x1="0" y1="18" x2="239" y2="18" stroke="#050505" stroke-opacity="0.28"/>
      <text x="0" y="51" fill="#050505" font-size="16" opacity="0.72">agentic workflows</text>
      <text x="0" y="78" fill="#050505" font-size="16" opacity="0.72">evolutionary AI</text>
      <text x="0" y="105" fill="#050505" font-size="16" opacity="0.72">argument engines</text>
